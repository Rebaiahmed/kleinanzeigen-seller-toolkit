<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Platzhalter: Seller Toolkit Screenshot</title>
  <desc id="desc">Hier wird nach der Veröffentlichung ein echter Screenshot der drei Werkzeuge ergänzt.</desc>
  <rect width="1200" height="560" rx="24" fill="#f2f5e8"/>
  <rect x="40" y="40" width="1120" height="70" rx="14" fill="#fff" stroke="#dce5cc"/>
  <rect x="40" y="145" width="350" height="355" rx="16" fill="#fff" stroke="#dce5cc"/>
  <rect x="425" y="145" width="350" height="355" rx="16" fill="#fff" stroke="#dce5cc"/>
  <rect x="810" y="145" width="350" height="355" rx="16" fill="#fff" stroke="#dce5cc"/>
  <circle cx="103" cy="75" r="18" fill="#a5c421"/>
  <text x="135" y="83" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#203029">Kleinanzeigen Seller Toolkit</text>
  <g font-family="Arial,sans-serif" fill="#203029"><text x="65" y="200" font-size="25" font-weight="bold">01 Preisrechner</text><text x="450" y="200" font-size="25" font-weight="bold">02 Antworten</text><text x="835" y="200" font-size="25" font-weight="bold">03 Checkliste</text><text x="600" y="300" text-anchor="middle" font-size="26" font-weight="bold">Screenshot-Platzhalter</text><text x="600" y="337" text-anchor="middle" font-size="17">Echtes Bild nach dem ersten Deployment ergänzen</text></g>
</svg>
